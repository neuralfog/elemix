[package]
name = "elemix-template-formatter"
version = "0.9.5"
edition = "2021"
publish = false
description = "HTML template formatter for Elemix tpl`` literals (etf)."
license = "MIT"
repository = "https://github.com/neuralfog/elemix"

[lib]
name = "elemix_template_formatter"
path = "src/lib.rs"

[[bin]]
name = "elemix-template-formatter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1", features = ["glob"] }
proptest = "1.11.0"

[[bench]]
name = "format"
harness = false

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
