[package]
name = "elemix-analyzer"
version = "0.9.8"
edition = "2021"
publish = false
description = "Template prop typechecker for Elemix (ec-analyzer)."
license = "MIT"
repository = "https://github.com/neuralfog/elemix"

[[bin]]
name = "elemix-analyzer"
path = "src/main.rs"

[dependencies]
elemix-compiler = { path = "../compiler", default-features = false }
clap = { version = "=4.6.8", features = ["derive"] }
glob = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"

[dev-dependencies]
proptest = "=1.12.0"

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
