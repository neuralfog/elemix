[package]
name = "elemix-compiler"
version = "1.0.0"
edition = "2021"
publish = false
description = "Ahead-of-time compiler for Elemix tpl templates."
license = "MIT"
repository = "https://github.com/neuralfog/elemix"

[lib]
name = "elemix_compiler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "elemix-compiler"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "ssr"
path = "ssr-harness/ssr.rs"

[[test]]
name = "ssr-snapshots"
path = "ssr-harness/ssr_snapshots.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:glob"]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
clap = { version = "=4.6.8", features = ["derive"], optional = true }
glob = { version = "=0.3.4", optional = true }
oxc_allocator = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_ast_visit = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_semantic = "=0.159.0"
oxc_span = "=0.159.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = { version = "=0.2.127", optional = true }
console_error_panic_hook = { version = "=0.1.7", optional = true }
grass = { version = "=0.13.4", default-features = false }

[dev-dependencies]
criterion = "=0.8.2"
insta = { version = "=1.48.0", features = ["glob"] }
proptest = "=1.12.0"

[[bench]]
name = "compile"
harness = false

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
