[package]
name = "elemix-compiler"
version = "0.9.5"
edition = "2021"
publish = false
description = "Ahead-of-time compiler for Elemix tpl templates."
license = "MIT"
repository = "https://github.com/neuralfog/elemix"

[lib]
name = "elemix_compiler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "elemix-compiler"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "ssr"
path = "ssr-harness/ssr.rs"

[[test]]
name = "ssr-snapshots"
path = "ssr-harness/ssr_snapshots.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:glob"]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
glob = { version = "0.3.3", optional = true }
oxc_allocator = "0.136.0"
oxc_ast = "0.136.0"
oxc_ast_visit = "0.136.0"
oxc_parser = "0.136.0"
oxc_span = "0.136.0"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1", features = ["glob"] }
proptest = "1.11.0"

[[bench]]
name = "compile"
harness = false

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
