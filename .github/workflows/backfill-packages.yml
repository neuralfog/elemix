name: backfill-packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish @neuralfog/elemix-ssr (npm) and Hydris.Build (NuGet) at (e.g. 0.9.6)'
        required: true

defaults:
  run:
    shell: bash

jobs:
  npm:
    name: backfill @neuralfog/elemix-ssr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Stamp version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["packages/elemix/package.json", "packages/elemix-ssr/package.json"]) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 4) + "\n");
            }
            console.log(`elemix-ssr@${v} (dep @neuralfog/elemix ${v})`);
          '

      - name: Build
        run: |
          pnpm --filter @neuralfog/elemix build
          pnpm --filter @neuralfog/elemix-ssr build

      - name: Wait for the elemix dependency
        run: |
          DEP="${{ inputs.version }}"
          echo "waiting for @neuralfog/elemix@$DEP on npm..."
          for i in $(seq 1 30); do
            if npm view "@neuralfog/elemix@$DEP" version >/dev/null 2>&1; then
              echo "✓ @neuralfog/elemix@$DEP is published"
              exit 0
            fi
            echo "  not yet ($i/30)..."; sleep 5
          done
          echo "::error::@neuralfog/elemix@$DEP is not on npm; publish it first"
          exit 1

      - name: Stage changelog
        run: cp CHANGELOG.md packages/elemix-ssr/CHANGELOG.md

      - name: Publish
        working-directory: packages/elemix-ssr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG=latest
          [[ "$VERSION" == *-* ]] && TAG=dev
          echo "publishing @neuralfog/elemix-ssr@$VERSION under dist-tag: $TAG"
          pnpm publish --access public --provenance --no-git-checks --tag "$TAG"

  nuget:
    name: backfill Hydris.Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build QuickJS native libraries
        working-directory: packages/hydris
        run: make build-native

      - name: Pack
        working-directory: packages/hydris
        run: |
          VERSION="${{ inputs.version }}"
          echo "packing Hydris.Build $VERSION"
          dotnet pack Hydris.Build/Hydris.Build.csproj -c Release -p:Version="$VERSION" -o "$GITHUB_WORKSPACE/nupkgs"
          ls -l "$GITHUB_WORKSPACE/nupkgs"

      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
