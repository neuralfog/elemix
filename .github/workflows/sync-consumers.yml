name: sync-consumers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin @neuralfog/elemix* and Hydris.* deps to (e.g. 0.9.6)'
        required: true

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: sync ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [compiler-explorer, elemix-playground, elemix-template]
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clone ${{ matrix.repo }}
        env:
          REPO_SYNC_TOKEN: ${{ secrets.NVIM_MIRROR_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${REPO_SYNC_TOKEN}@github.com/neuralfog/${{ matrix.repo }}.git" repo

      - name: Bump @neuralfog/elemix* deps
        id: bump
        working-directory: repo
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "::error::VERSION is empty"; exit 1; fi
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const raw = fs.readFileSync("package.json", "utf8");
            const indent = raw.match(/^([ \t]+)"/m)?.[1] ?? "  ";
            const p = JSON.parse(raw);
            const isElemix = (n) => n === "@neuralfog/elemix" || n.startsWith("@neuralfog/elemix-");
            let changed = 0;
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = p[field];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                if (isElemix(name) && deps[name] !== v) { deps[name] = v; changed++; }
              }
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, indent) + "\n");
            console.log(`bumped ${changed} @neuralfog/elemix* dep(s) to ${v}`);
          '
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already at ${VERSION}; nothing to sync"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh lockfile
        if: steps.bump.outputs.changed == 'true'
        working-directory: repo
        run: |
          for i in $(seq 1 6); do
            pnpm install --no-frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i); retrying..."
            sleep 10
          done
          echo "::error::pnpm install did not succeed for ${{ matrix.repo }}"
          exit 1

      - name: Commit + push
        if: steps.bump.outputs.changed == 'true'
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v${{ inputs.version }}"
          git push

  sync-benchmarks:
    name: sync elemix-ssr-benchmarks
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clone elemix-ssr-benchmarks
        env:
          REPO_SYNC_TOKEN: ${{ secrets.NVIM_MIRROR_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${REPO_SYNC_TOKEN}@github.com/neuralfog/elemix-ssr-benchmarks.git" repo

      - name: Bump elemix + hydris deps in hydris/
        id: bump
        working-directory: repo/hydris
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "::error::VERSION is empty"; exit 1; fi
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const raw = fs.readFileSync("package.json", "utf8");
            const indent = raw.match(/^([ \t]+)"/m)?.[1] ?? "  ";
            const p = JSON.parse(raw);
            const isElemix = (n) => n === "@neuralfog/elemix" || n.startsWith("@neuralfog/elemix-");
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = p[field];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                if (isElemix(name) && deps[name] !== v) deps[name] = v;
              }
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, indent) + "\n");
          '
          sed -i -E "s|(<PackageReference Include=\"Hydris\.[^\"]+\" Version=\")[^\"]+\"|\1${VERSION}\"|g" Hydris.Bench.csproj
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const f = ".config/dotnet-tools.json";
            const t = JSON.parse(fs.readFileSync(f, "utf8"));
            for (const name of Object.keys(t.tools ?? {})) {
              if (name.startsWith("hydris.")) t.tools[name].version = v;
            }
            fs.writeFileSync(f, JSON.stringify(t, null, 2) + "\n");
          '
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already at ${VERSION}; nothing to sync"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh pnpm lockfile
        if: steps.bump.outputs.changed == 'true'
        working-directory: repo/hydris
        run: |
          for i in $(seq 1 6); do
            pnpm install --no-frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i); retrying..."
            sleep 10
          done
          echo "::error::pnpm install did not succeed for elemix-ssr-benchmarks"
          exit 1

      - name: Commit + push
        if: steps.bump.outputs.changed == 'true'
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v${{ inputs.version }}"
          git push
