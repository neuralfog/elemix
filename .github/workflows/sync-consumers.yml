name: sync-consumers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin @neuralfog/elemix* deps to (e.g. 0.9.3)'
        required: true

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: sync ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [compiler-explorer, elemix-playground, elemix-template]
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clone ${{ matrix.repo }}
        env:
          REPO_SYNC_TOKEN: ${{ secrets.NVIM_MIRROR_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${REPO_SYNC_TOKEN}@github.com/neuralfog/${{ matrix.repo }}.git" repo

      - name: Bump @neuralfog/elemix* deps
        working-directory: repo
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const raw = fs.readFileSync("package.json", "utf8");
            const indent = raw.match(/^([ \t]+)"/m)?.[1] ?? "  ";
            const p = JSON.parse(raw);
            const isElemix = (n) => n === "@neuralfog/elemix" || n.startsWith("@neuralfog/elemix-");
            let changed = 0;
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = p[field];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                if (isElemix(name)) { deps[name] = v; changed++; }
              }
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, indent) + "\n");
            console.log(`bumped ${changed} @neuralfog/elemix* dep(s) to ${v}`);
          '

      - name: Refresh lockfile
        working-directory: repo
        run: |
          for i in $(seq 1 6); do
            pnpm install --no-frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i); retrying..."
            sleep 10
          done
          echo "::error::pnpm install did not succeed for ${{ matrix.repo }}"
          exit 1

      - name: Commit + push
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no changes for ${{ matrix.repo }}"
            exit 0
          fi
          git add -A
          git commit -m "v${{ inputs.version }}"
          git push
